name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A push that lands while an earlier run is still going supersedes it. CI here
# is minutes long and nobody reads the result of a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The six Python packages, plus the two ROS packages' pure-Python tests.
  # No ROS install: everything here is deliberately runnable on a bare laptop,
  # which is what lets most of the project be developed without a robot.
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest (no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test each package from its own directory
        # Per-package, from inside each directory, on purpose: the
        # tests/conftest.py files collide if pytest is run once from the repo
        # root. See CLAUDE.md.
        run: |
          set -e
          for pkg in src/neo_webapp src/neo_perception src/neo_motion \
                     src/neo_emotion src/model-conn src/intelligence \
                     src/neo_msgs src/neo_bringup; do
            echo "::group::$pkg"
            (cd "$pkg" && python -m pytest -q)
            echo "::endgroup::"
          done

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      # Bug-catching rules only: syntax errors, undefined names, broken
      # comparisons. Style is not enforced here -- a lint job that fails on an
      # unused import trains you to ignore a red CI, which costs more than the
      # import does. Widen the ruleset when there is an agreed style to enforce.
      - run: ruff check src/ --select E9,F63,F7,F82

  # ---------------------------------------------------------------------------
  # The actual ROS build: generates the message code and runs the ament tests.
  # This is what proves the frozen contracts in neo_msgs are valid IDL -- the
  # pytest job above only checks them as text.
  # ---------------------------------------------------------------------------
  colcon:
    name: colcon build + test (Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          rosdep update --rosdistro jazzy
          # Only neo_msgs and neo_bringup are built: the six Python packages
          # carry a COLCON_IGNORE, because pip owns their install (see the root
          # setup.py, and the note inside any of those files).
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Build
        shell: bash
        # --base-paths src is load-bearing, not decoration. The repo root has a
        # setup.py, so a bare `colcon build` identifies the root itself as one
        # Python package and never descends into src/ -- it finds neither
        # neo_msgs nor neo_bringup, reports "0 packages finished", and exits 0.
        # A green build that built nothing is the worst possible outcome here,
        # since this job is the only thing validating the contracts as real IDL.
        run: |
          set -e
          . /opt/ros/jazzy/setup.sh
          colcon build --base-paths src --symlink-install
          # Fail loudly rather than silently if discovery ever breaks again.
          test -d install/neo_msgs || { echo "neo_msgs was not built"; exit 1; }

      - name: Test
        shell: bash
        # The contract test's drift checks compare neo_msgs against the Python
        # mirror dataclasses, which are not pip-installed in this container, so
        # they skip here. The pytest job above is where they actually run.
        run: |
          set -e
          . /opt/ros/jazzy/setup.sh
          colcon test --base-paths src --event-handlers console_direct+
          colcon test-result --verbose

      - name: Show the frozen contract
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          ros2 interface show neo_msgs/msg/HeadCommand
